name: Build app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: Mac-AppleSilicon
          - os: macos-15-intel
            label: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller pillow pillow-heif
      - name: Check that the engine and app load
        run: python -c "import fukugen, app; print('ok')"
      - name: Recovery self-test
        run: python selftest.py
      - name: Recover files Windows deleted from real NTFS and exFAT drives
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci_undelete_windows.ps1
      - name: iPhone USB script runs (no phone attached)
        if: runner.os == 'Windows'
        run: python ci_usb_check.py
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: |
          python make_splash.py
          pyinstaller --noconfirm --onefile --windowed --uac-admin --splash splash.png --name Fukugen --collect-all pillow_heif --hidden-import PIL._tkinter_finder --hidden-import selftest app.py
          Move-Item dist/Fukugen.exe dist/Fukugen-Windows.exe
          pyinstaller --noconfirm --onedir --windowed --uac-admin --name Fukugen --distpath folder --workpath build_folder --collect-all pillow_heif --hidden-import PIL._tkinter_finder --hidden-import selftest app.py
          Compress-Archive -Path folder/Fukugen -DestinationPath dist/Fukugen-Windows.zip
          $p = Start-Process -FilePath folder/Fukugen/Fukugen.exe -ArgumentList "--selftest-gui", "`"$PWD\gui_folder.json`"" -PassThru
          $null = $p.WaitForExit(180000)
          Get-Content gui_folder.json
          if (-not (Select-String -Path gui_folder.json -Pattern '"ok": true' -Quiet)) { exit 1 }
      - name: Open the built Windows app and scan a test card
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $PWD "gui.json"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath dist/Fukugen-Windows.exe -ArgumentList "--selftest-gui", "`"$out`"" -PassThru
          $null = $p.WaitForExit(180000)
          "app closed after $([math]::Round($sw.Elapsed.TotalSeconds,1)) seconds"
          if (Test-Path $out) { Get-Content $out } else { "no result file" }
          $log = Join-Path $env:LOCALAPPDATA "Fukugen\error.log"
          if (Test-Path $log) { Get-Content $log }
          if (-not (Test-Path $out) -or -not (Select-String -Path $out -Pattern '"ok": true' -Quiet)) { exit 1 }
      - name: Build Mac app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Fukugen --collect-all pillow_heif --hidden-import PIL._tkinter_finder --hidden-import selftest app.py
          cd dist && ditto -c -k --keepParent Fukugen.app Fukugen-${{ matrix.label }}.zip
      - name: Open the built Mac app and scan a test card
        if: runner.os == 'macOS'
        run: |
          start=$(date +%s)
          dist/Fukugen.app/Contents/MacOS/Fukugen --selftest-gui "$PWD/gui.json" &
          pid=$!
          for i in $(seq 1 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          echo "app closed after $(( $(date +%s) - start )) seconds"
          cat gui.json || echo "no result file"
          cat ~/Fukugen/error.log 2>/dev/null || true
          grep -q '"ok": true' gui.json
      - uses: actions/upload-artifact@v4
        with:
          name: Fukugen-${{ matrix.label }}
          path: dist/Fukugen-*

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if ! gh release view app-latest >/dev/null 2>&1; then
            gh release create app-latest --title "復元アプリ（最新版）" --notes-file RELEASE_NOTES.md --latest --target "$GITHUB_SHA"
          else
            gh release edit app-latest --notes-file RELEASE_NOTES.md --latest
          fi
          gh release upload app-latest out/* --clobber
